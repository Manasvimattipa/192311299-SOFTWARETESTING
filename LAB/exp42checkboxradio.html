
<!DOCTYPE html>
<html>
<head>
    <title>Checkbox and Radio Selection</title>
</head>
<body>

    <h2>Select Your Preferences</h2>

    <h3>Checkbox</h3>
    <input type="checkbox" id="checkbox1"> Option 1

    <h3>Radio Button</h3>
    <input type="radio" id="radio1" name="choice"> Choice 1
    <input type="radio" id="radio2" name="choice"> Choice 2

</body>
</html>
