<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>
<body>
    <h2>Select a Car</h2>

    <select id="cars">
        <option value="">Choose a car</option>
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="audi">Audi</option>
        <option value="bmw">BMW</option>
    </select>

</body>
</html>
